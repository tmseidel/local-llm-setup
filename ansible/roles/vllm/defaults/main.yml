---
# ============================================================
#  vLLM Rolle — Standardwerte
#  Überschreiben in group_vars/all.yml
# ============================================================

# Aktivierungs-Flag — vLLM ist optional
vllm_enabled: true

# Python-Umgebung
vllm_install_dir: /opt/vllm
vllm_venv_dir: /opt/vllm/env
vllm_log_dir: /var/log/vllm
# Login-User (z.B. tom), NICHT ansible_user_id — letzteres ist unter
# become: true == root und würde den Dienst als root laufen lassen.
vllm_user: "{{ ansible_user }}"

# Server-Konfiguration
vllm_host: "0.0.0.0"
vllm_port: 8001            # Kein Konflikt mit Ollama auf 11434

# Modell — AWQ INT4 für optimale tok/s pro VRAM-GB.
# Reale Alternativen, die mit TP=2 in 2×16 GB passen:
#   Qwen/Qwen3-32B-AWQ                  (AWQ INT4, ~19 GB — Default)
#   Qwen/Qwen2.5-Coder-32B-Instruct-AWQ (AWQ INT4, ~19 GB — Coding)
#   Qwen/Qwen3-14B-AWQ                  (AWQ INT4, ~10 GB — schneller)
vllm_model: "Qwen/Qwen3-32B-AWQ"

# Blackwell (sm_120): AWQ über den Marlin-Kernel.
vllm_quantization: "awq_marlin"   # awq_marlin | gptq_marlin | fp8 | none

# Attention-Backend (Blackwell-tauglich). FLASH_ATTN ist auf sm_120 defekt.
vllm_attention_backend: "TRITON_ATTN"

# Reasoning-Parser: trennt <think>…</think> aus Qwen3 in ein eigenes Feld
# (`reasoning_content`); `content` bleibt sauber. Leer = aus.
vllm_reasoning_parser: "qwen3"

# Tool-/Function-Calling (OpenAI-kompatibel) aktivieren.
vllm_enable_tool_calling: true
# Parser MUSS zum Modell-Tool-Format passen:
#   hermes        → Qwen3 (dense/instruct, z.B. Qwen3-32B), Qwen2.5, QwQ
#   qwen3_coder   → NUR Qwen3-Coder-Modelle (anderes XML-Format)
# Falscher Parser = Tool-Calls werden nicht als `tool_calls` erkannt.
vllm_tool_call_parser: "hermes"

# CUDA-Graphs deaktivieren — MoE + TP über PCIe (kein NVLink/P2P) führt mit
# CUDA Graphs zu Deadlocks in der Shared-Memory-Kommunikation zwischen Workern
# (sample_tokens Timeout nach langer Generierung).
vllm_enforce_eager: true

# Kontext & Speicher — eine Engine zur Zeit, daher volle GPU nutzbar
vllm_max_model_len: 65536
vllm_gpu_memory_utilization: "0.95"
vllm_max_num_seqs: 32      # Maximale parallele Sequences (gut für Agenten)
vllm_max_num_batched_tokens: 4096  # Muss >= Mamba block_size (Qwen3.6: 2096)

# KV-Cache-Quantisierung. fp8 halbiert den KV-VRAM-Bedarf (2→1 Byte/Elem)
# → ~doppelte Kontextlänge bei nahezu identischer Qualität. Auf Blackwell nativ.
# "auto" = fp16 (kein Flag gesetzt).
vllm_kv_cache_dtype: "fp8"

# Prefix Caching: KV-Cache-Blöcke für wiederkehrende Prompt-Präfixe behalten.
# System-Prompts, Tool-Definitionen etc. werden nur einmal berechnet → schneller
# TTFT bei Agent-Workloads. Kein Nachteil.
vllm_enable_prefix_caching: true

# Chunked Prefill: Lange Prefills in Chunks aufteilen, damit Decode-Requests
# nicht blockiert werden. V1-Engine hat es per Default an; explizit setzen
# zur Dokumentation.
vllm_enable_chunked_prefill: true

# Prometheus-Metriken sind in modernen vLLM-Versionen (V1-Engine) standardmäßig
# aktiviert — kein Flag nötig. Abrufbar unter: curl http://localhost:8001/metrics
# Zum Deaktivieren: --disable-metrics in vllm_start.sh.j2 ergänzen.

# RoPE-Scaling (YaRN), um über die native Kontextlänge (Qwen3 = 32768) hinaus
# zu gehen. Für 64K: factor 2.0 (32768×2=65536). Leer = aus (native Länge).
# Statischer Faktor verschlechtert kurze Kontexte leicht — nur so groß wie nötig.
vllm_rope_scaling: '{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":32768}'

# Modellgewichte in den CPU-RAM auslagern (GiB pro GPU), um VRAM für KV-Cache
# freizumachen. Nutzt die 64 GB RAM. ACHTUNG: Gewichte streamen pro Forward-Pass
# über PCIe → spürbar langsamer (besonders bei Pipeline-Parallel). 0 = aus.
vllm_cpu_offload_gb: 0

# HuggingFace Cache-Verzeichnis (Modelle werden hier gespeichert)
vllm_hf_cache_dir: /opt/vllm/hf_cache

# Parallelismus über GPUs. Default = TP=2 für 2× GeForce ohne NVLink.
# TP=2 besser bei niedriger Concurrency (Agent-Workloads, 1-4 Requests).
# PP=2 besser bei hoher Concurrency (8+ Requests) durch Microbatching.
# tensor*pipeline = Anzahl genutzter GPUs.
vllm_tensor_parallel_size: 2
vllm_pipeline_parallel_size: 1

# API-Key (leer = kein Auth, für LAN-Deployment ausreichend)
vllm_api_key: ""  # Kein Auth fuer LAN

# Systemd-Dienst
vllm_service_name: vllm
vllm_service_restart: "on-failure"
vllm_service_restart_sec: 10




