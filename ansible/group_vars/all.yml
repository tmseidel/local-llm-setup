---
# ============================================================
#  Globale Konfiguration — hier alles anpassen
# ============================================================

# --- Inferenz-Engine-Auswahl --------------------------------
# Es läuft IMMER nur EINE Engine (sie teilen sich NICHT den VRAM).
# Die jeweils andere wird gestoppt + deaktiviert, sodass die aktive
# Engine die vollen 32 GB VRAM nutzen kann.
#   "vllm"   → vLLM aktiv (parallele Agenten-Workloads, TP über beide GPUs)
#   "ollama" → Ollama aktiv (Einzel-Requests, Web-UI, Modell-Wechsel)
inference_engine: "vllm"

# --- Ollama ---------------------------------------------------
ollama_version: "latest"
ollama_host: "0.0.0.0"        # Auf allen Interfaces lauschen (für LAN-Zugriff)
ollama_port: 11434
ollama_models:
  - "qwen3.6:35b-a3b"
  # Weitere Modelle einfach hier ergänzen (müssen in 32 GB passen):
  # - "qwen3.6:27b"         # Dense, Multimodal
  # - "qwen3.5:35b-a3b"    # MoE, Vorgänger von 3.6
  # - "qwen3:30b-a3b"      # MoE, schnell (älter)

# Kontext-Fenstergröße (Token) → wird als OLLAMA_CONTEXT_LENGTH gesetzt.
# Hinweis: OLLAMA_GPU_MEMORY_FRACTION existiert NICHT in Ollama und wurde
# entfernt; Ollama verwaltet den VRAM automatisch (ggf. OLLAMA_GPU_OVERHEAD).
ollama_num_ctx: 32768

# --- Open WebUI -----------------------------------------------
open_webui_version: "main"
open_webui_port: 8080
open_webui_data_dir: "/opt/open-webui/data"

# --- Docker ---------------------------------------------------
docker_users:
  - "{{ ansible_user }}"   # Login-User (nicht root!) zur docker-Gruppe

# --- vLLM (optional, für parallele Agenten-Workloads) --------
# Auf false setzen wenn nur Ollama gewünscht wird
vllm_enabled: true

# Port: Kein Konflikt mit Ollama (11434) oder Open WebUI (8080)
vllm_port: 8001

# Modell für vLLM — AWQ INT4 (Qwen3.6-35B-A3B ≈ 20 GB Gewichte, MoE mit ~3B aktiv).
# Wird über BEIDE RTX 5060 Ti (2×16 GB) verteilt (Parallelismus s. unten).
# Alternativen (alle real, passen in 32 GB):
#   Qwen/Qwen3.6-27B-AWQ                 (~18 GB, Dense, Multimodal)
#   cyankiwi/Qwen3.5-35B-A3B-AWQ-4bit   (~20 GB, MoE, Vorgänger von 3.6)
#   Qwen/Qwen3-14B-AWQ                   (~10 GB, schneller; tensor=1, pipeline=1)
vllm_model: "cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit"

# Blackwell (sm_120): AWQ läuft stabil mit dem Marlin-Kernel.
vllm_quantization: "awq_marlin"   # awq_marlin | gptq_marlin | fp8 | none

# Attention-Backend für Blackwell + Qwen3.6 (Gated DeltaNet MoE):
# TRITON_ATTN funktioniert out-of-the-box und ist kompatibel mit der
# hybriden Attention-Architektur. FLASH_ATTN ist auf sm_120 defekt;
# FLASHINFER braucht eine JIT-Toolchain (gcc, python3-dev, nvcc, ninja).
vllm_attention_backend: "TRITON_ATTN"

# CUDA-Graphs: false = aktiviert (deutlich schneller, vermeidet Triton-JIT
# während der Inferenz). MoE + TP über PCIe (kein P2P) verursacht mit CUDA
# Graphs Deadlocks → enforce_eager=true für Stabilität.
vllm_enforce_eager: true

# Tool-/Function-Calling (OpenAI-kompatibel).
vllm_enable_tool_calling: true
# Parser MUSS zum Tool-Format des Modells passen:
#   qwen3_coder  → Qwen3.5/3.6 (alle Varianten inkl. MoE A3B) — offiziell empfohlen
#   hermes       → Qwen3 dense/MoE (älter), Qwen2.5, QwQ
#   qwen3_coder ist auch für Nicht-Coder-Modelle korrekt (Qwen3.6 änderte das Format)
vllm_tool_call_parser: "qwen3_coder"

# Reasoning-Parser für Qwen3 (<think>…</think> → reasoning_content). Leer = aus.
vllm_reasoning_parser: "qwen3"

# Kontext und Parallelität — volle GPU verfügbar (kein Co-Tenant)
# 65536 (64K) für den Hermes-Agenten. Möglich durch fp8-KV-Cache + YaRN (unten).
# Falls 64K nicht gebraucht wird: 32768 setzen + vllm_rope_scaling leer → spart
# ~4 GB KV-VRAM, mehr Platz für Batching.
vllm_max_model_len: 65536
vllm_gpu_memory_utilization: "0.95"   # 0.95 sicher (kein Co-Tenant, Ollama aus)
vllm_max_num_seqs: 8              # Limitiert: ~12 GB KV-Rest bei 20 GB Gewichten
                                  # 65K ctx @ fp8 ≈ 8 GB/Seq → max ~1-2 volle Seqs,
                                  # aber im Schnitt kürzere Kontexte → 8 ist sicher

# Max Tokens pro Batch (Chunked-Prefill-Größe).
# MUSS >= Mamba block_size sein (Qwen3.6 hybrid: 2096). Default 2048 crasht mit:
#   "AssertionError: block_size (2096) must be <= max_num_batched_tokens (2048)"
# 4096 = sicherer Wert, gute Balance zwischen Prefill-Throughput und Aktivierungs-VRAM.
vllm_max_num_batched_tokens: 4096

# Prefix Caching — KV-Cache für wiederkehrende Prompt-Präfixe (System-Prompts,
# Tool-Definitionen) wiederverwenden. Kostenlos 50-80% TTFT-Verbesserung bei
# Agent-Workloads mit wiederholten Präfixen.
vllm_enable_prefix_caching: true

# Prometheus-Metriken sind in modernen vLLM-Versionen standardmäßig aktiv.
# Abrufbar unter: curl http://localhost:8001/metrics
# Zum Deaktivieren: --disable-metrics in vllm_start.sh.j2 ergänzen.

# --- 64K-Kontext: VRAM-Hebel -------------------------------------
# 1) fp8-KV-Cache halbiert den KV-VRAM (0.25→0.125 MiB/Token) → 64K ≈ 8 GiB
#    KV total, mit TP=2 also ~4 GiB/GPU. DER entscheidende Hebel.
vllm_kv_cache_dtype: "fp8"          # "auto" = fp16 (doppelter KV-Bedarf)

# 2) Qwen3.6 unterstützt NATIV bis zu 262.144 Token — kein RoPE-Scaling nötig für 65K!
#    (Qwen3-32B brauchte YaRN weil nur 32K nativ. Qwen3.6 hat das nicht mehr nötig.)
#    Leer lassen = nativen Context nutzen. Nur setzen falls > 262K gewünscht.
vllm_rope_scaling: ""

# 3) FALLBACK, falls VRAM trotz fp8 noch knapp: Gewichte in die 64 GB RAM
#    auslagern (GiB/GPU). Macht VRAM für KV frei, ABER Gewichte streamen pro
#    Forward-Pass über PCIe → deutlich langsamer. Erst erhöhen, wenn nötig. 0 = aus.
vllm_cpu_offload_gb: 0

# Parallelismus über die 2 GPUs:
# TP=2 vs PP=2 Trade-off (beide ~20 tok/s Basis auf diesem Hardware):
#   PP=2: Pipeline-Bubble → bei 1-4 Requests eine GPU ~50% idle.
#         Skaliert gut bei hoher Concurrency (8+).
#   TP=2: All-Reduce pro Layer über PCIe, aber beide GPUs immer busy.
#         Besser bei niedriger Concurrency (typischer Agent-Workload).
# Empfehlung für Agent-Workloads: TP=2 testen. Falls bei 8+ parallelen
# Requests PP=2 besser ist, zurückwechseln.
vllm_tensor_parallel_size: 2
vllm_pipeline_parallel_size: 1

# HuggingFace Token (optional, NUR für gated models).
# Für öffentliche Qwen-Modelle NICHT nötig → leer lassen.
# Für gated models: per Ansible-Vault oder -e übergeben, NIEMALS hier committen!
vllm_hf_token: ""

# --- NVIDIA ---------------------------------------------------
# Treiber-Installationsmethode: "ubuntu-drivers" oder "manual"
nvidia_driver_method: "ubuntu-drivers"
# Minimale Treiber-Version — Blackwell (RTX 50xx) erfordert >= 570
nvidia_driver_min_version: 570






